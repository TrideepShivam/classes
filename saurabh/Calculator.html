<html>
	<head>
		<title>Calculator</title>
		<style>
			body{
				background:white;
				margin:0;
				display:flex;
				align-items:center;
				justify-content:center;
			}
			table{
				height:400px;
				width:350px;
				border:1px solid white;
				border-top:none;
				color:rgba(0,0,0,0.7);
			}
			table td{
				height:50px;
				width:50px;
				text-align:center;
				font-weight:bold;
				font-size:25px;
				font-family:arial;
				background-color:rgba(0,0,0,0.1);
				border:1px solid rgba(0,0,0,0.1);
			}
			#Equal{
				background-color:dodgerblue;
				color:white;
			}
			#clrchng{
				background-color:rgba(0,0,0,0.3);
			}
			div{
				border:1px solid rgba(0,0,0,0.3);
				box-shadow:1px 1px 10px grey;
			}
			#space{
				background-color:white;
			}
		</style>
	</head>
	<body>
		<div>
			<table cellspacing="10px">
				<tr>
					<td colspan="4" id="space"></td>
					<!-- <td></td>
					<td></td>
					<td></td> -->
				</tr>
				<tr id="clrchng">
					<td>+</td>
					<td>-</td>
					<td>*</td>
					<td>/</td>
				</tr>
				<tr>
					<td>7</td>
					<td>8</td>
					<td>9</td>
					<td rowspan="4" id="Equal">=</td>
				</tr>
				<tr>
					<td>4</td>
					<td>5</td>
					<td>6</td>
					<!-- <td></td> -->
				</tr>
				<tr>
					<td>1</td>
					<td>2</td>
					<td>3</td>
					<!-- <td></td> -->
				</tr>
				<tr>
					<td>0</td>
					<td>.</td>
					<td>C</td>
					<!-- <td></td> -->
				</tr>
			</table>
		</div>
	</body>
</html>
